<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-center items-center px-6 selection:bg-indigo-500 selection:text-white">

  <main class="text-center flex flex-col items-center justify-center max-w-3xl my-auto py-12">
    <!-- Glowing Avatar -->
    <div class="avatar-glow mb-8">
      <img src="pict/pict1.JPG" 
           alt="Foto Profil" 
           class="w-40 h-40 md:w-48 md:h-48 rounded-full object-cover border-4 border-slate-900 shadow-2xl relative z-10">
    </div>

    <!-- Intro Header -->
    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4">
      Halo, Saya <span class="gradient-text">Abdi Fysabilillah</span>
    </h1>

    <p class="text-lg md:text-xl text-slate-400 mb-8 max-w-xl font-light leading-relaxed">
      Full-Stack Web Developer & UI/UX Specialist
    </p>

    <!-- CTA Button Redirect to About Page -->
    <a href="about.html" class="btn-primary px-8 py-3.5 text-white font-semibold rounded-full inline-flex items-center gap-3 text-base">
      Jelajahi Profile <i class="fa-solid fa-arrow-right text-sm"></i>
    </a>
  </main>

  <script src="script.js"></script>
</body>
</html>
