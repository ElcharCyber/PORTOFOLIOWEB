<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Portofolio Abdi Fysabilillah</title>
  <meta name="description"
    content="Masuk ke halaman portfolio Abdi Fysabilillah — Full-Stack Web Developer & UI/UX Specialist.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="selection:bg-indigo-500 selection:text-white">

  <!-- Login Wrapper -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand / Logo -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="fa-solid fa-code"></i>
        </div>
        <h1><span class="gradient-text">Portofolio</span></h1>
        <p>Masuk untuk mengakses portfolio saya</p>
      </div>

      <!-- Error Message -->
      <div id="errorMsg" class="error-msg" role="alert" aria-live="polite">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Email/Username dan Password tidak boleh kosong.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>

        <!-- Email / Username -->
        <div class="form-group">
          <label for="loginEmail">Email / Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="loginEmail" name="email" class="form-input"
              placeholder="Masukkan email atau username" autocomplete="username" aria-required="true">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="loginPassword" name="password" class="form-input" placeholder="Masukkan password"
              autocomplete="current-password" style="padding-right: 3rem;" aria-required="true">
            <button type="button" class="password-toggle" id="togglePassword"
              aria-label="Tampilkan/Sembunyikan password" title="Tampilkan password">
              <i class="fa-solid fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Lupa Password -->
        <div class="form-row">
          <label class="checkbox-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="remember">
            Ingat saya
          </label>
          <a href="#" class="forgot-link" id="forgotPasswordLink">Lupa Password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="loginBtn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-login-text"><i class="fa-solid fa-right-to-bracket"></i> Masuk</span>
        </button>

      </form>

      <!-- Divider -->
      <div class="login-divider">belum punya akun?</div>

      <!-- Footer Links -->
      <div class="login-footer" style="display:flex; flex-direction:column; gap:0.6rem;">
        <a href="register.html" id="toRegisterLink">
          <i class="fa-solid fa-user-plus text-xs mr-1"></i>Daftar Akun Baru
        </a>
        <a href="index.html" id="backToLanding" style="color:#64748b; font-weight:400;">
          <i class="fa-solid fa-arrow-left text-xs mr-1"></i>Kembali ke Landing Page
        </a>
      </div>

    </div>
  </div>

  <!-- Forgot Password Modal (UI only) -->
  <div id="forgotModal" style="
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(6px);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:1rem;
  ">
    <div class="login-card" style="max-width:400px; animation: card-enter 0.35s cubic-bezier(0.4,0,0.2,1) both;">
      <div class="login-brand" style="margin-bottom:1.25rem;">
        <div class="login-brand-icon" style="background:linear-gradient(135deg,#7c3aed,#ec4899);">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 style="font-size:1.2rem;" class="gradient-text">Reset Password</h1>
        <p>Masukkan email untuk instruksi reset.</p>
      </div>
      <div class="form-group">
        <label for="resetEmail">Email Terdaftar</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="resetEmail" class="form-input" placeholder="email@example.com">
        </div>
      </div>
      <button type="button" class="btn-login" onclick="closeForgotModal()"
        style="background:linear-gradient(135deg,#7c3aed,#ec4899); box-shadow:0 4px 20px rgba(124,58,237,0.4);">
        <i class="fa-solid fa-paper-plane"></i> <span>Kirim Instruksi (Demo)</span>
      </button>
      <div class="login-footer" style="margin-top:1rem;">
        <a href="#" onclick="closeForgotModal(); return false;">
          <i class="fa-solid fa-xmark text-xs mr-1"></i>Tutup
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="login.js"></script>
</body>

</html>
