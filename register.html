<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — Portofolio Abdi Fysabilillah</title>
  <meta name="description"
    content="Buat akun untuk mengakses portfolio Abdi Fysabilillah — Full-Stack Web Developer & UI/UX Specialist.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="selection:bg-indigo-500 selection:text-white">

  <!-- Register Wrapper -->
  <div class="login-wrapper">
    <div class="login-card" style="max-width: 480px;">

      <!-- Brand / Logo -->
      <div class="login-brand">
        <div class="login-brand-icon" style="background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%); box-shadow: 0 8px 24px rgba(124,58,237,0.45);">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1><span class="gradient-text">Buat Akun</span></h1>
        <p>Daftar untuk mengakses portfolio saya</p>
      </div>

      <!-- Alert Message -->
      <div id="alertMsg" class="error-msg" role="alert" aria-live="polite">
        <i class="fa-solid fa-circle-exclamation" id="alertIcon"></i>
        <span id="alertText">Semua field wajib diisi.</span>
      </div>

      <!-- Success Message -->
      <div id="successMsg" class="success-msg" role="status" aria-live="polite" style="display:none;">
        <i class="fa-solid fa-circle-check"></i>
        <span id="successText">Registrasi berhasil! Mengarahkan ke halaman login...</span>
      </div>

      <!-- Register Form -->
      <form id="registerForm" novalidate>

        <!-- Nama Lengkap -->
        <div class="form-group">
          <label for="regFullName">Nama Lengkap</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card input-icon"></i>
            <input type="text" id="regFullName" name="full_name" class="form-input"
              placeholder="Masukkan nama lengkap" autocomplete="name" aria-required="true">
          </div>
        </div>

        <!-- Username -->
        <div class="form-group">
          <label for="regUsername">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-at input-icon"></i>
            <input type="text" id="regUsername" name="username" class="form-input"
              placeholder="Pilih username (3–30 karakter)" autocomplete="username" aria-required="true">
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="regEmail">Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="regEmail" name="email" class="form-input"
              placeholder="email@example.com" autocomplete="email" aria-required="true">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="regPassword" name="password" class="form-input"
              placeholder="Minimal 6 karakter" autocomplete="new-password"
              style="padding-right: 3rem;" aria-required="true">
            <button type="button" class="password-toggle" id="togglePassword"
              aria-label="Tampilkan/Sembunyikan password" title="Tampilkan password">
              <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <!-- Konfirmasi Password -->
        <div class="form-group">
          <label for="regConfirm">Konfirmasi Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input type="password" id="regConfirm" name="confirm_password" class="form-input"
              placeholder="Ulangi password" autocomplete="new-password"
              style="padding-right: 3rem;" aria-required="true">
            <button type="button" class="password-toggle" id="toggleConfirm"
              aria-label="Tampilkan/Sembunyikan konfirmasi password" title="Tampilkan password">
              <i class="fa-solid fa-eye" id="toggleConfirmIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="registerBtn"
          style="background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%); box-shadow: 0 4px 20px rgba(124,58,237,0.4);">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-login-text"><i class="fa-solid fa-user-plus"></i> Daftar Sekarang</span>
        </button>

      </form>

      <!-- Divider -->
      <div class="login-divider">sudah punya akun?</div>

      <!-- Footer Links -->
      <div class="login-footer">
        <a href="login.html" id="toLoginLink">
          <i class="fa-solid fa-right-to-bracket text-xs mr-1"></i>Masuk ke Akun
        </a>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script src="register.js"></script>
</body>

</html>
